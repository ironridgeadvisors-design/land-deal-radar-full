<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"></head><body><title>Land Deal Radar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one sticky control bar, then either a stack of broker call cards or a property table. Dark first, same forest ground as the old radar. */
:root{
  --bg:#0f1411; --panel:#161d18; --panel2:#1c251f; --line:#2a362e; --fg:#e6efe8; --mute:#8ba291;
  --accent:#56c08d; --accent-ink:#0b1a12; --hot:#f0b34a; --warn:#e2725b; --cool:#7fb2d9; --dim:#5f7366;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif; --body:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f6f2; --panel:#ffffff; --panel2:#eaf0ea; --line:#d3ddd4; --fg:#16211a; --mute:#566a5c;
  --accent:#1f7a4d; --accent-ink:#ffffff; --hot:#9a6200; --warn:#b3412b; --cool:#2b6a99; --dim:#8a9a8e; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f6f2; --panel:#ffffff; --panel2:#eaf0ea; --line:#d3ddd4; --fg:#16211a; --mute:#566a5c;
  --accent:#1f7a4d; --accent-ink:#ffffff; --hot:#9a6200; --warn:#b3412b; --cool:#2b6a99; --dim:#8a9a8e; color-scheme:light; }
*{box-sizing:border-box}
#gate{min-height:70vh;display:grid;place-items:center;padding:24px 16px}
#gate form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
#gate label{color:var(--mute);font-size:12.5px} #gate input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
#gate button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;font:600 14px var(--display);cursor:pointer}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
a{color:var(--accent)} a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font:700 24px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.built{color:var(--mute);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.tile b{display:block;font:600 13px var(--display)} .tile span{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mute);border:0;padding:7px 12px;font:600 13px var(--display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mute);border-radius:999px;padding:5px 11px;font:500 12.5px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
select,input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
input[type=search]{flex:1 1 180px;min-width:0}
label.ck{color:var(--mute);font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.count{color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.k-uc{--k:var(--hot)} .k-sp{--k:var(--hot)} .k-old{--k:var(--dim)} .k-gone{--k:var(--warn)} .k-new{--k:var(--accent)} .k-auc{--k:var(--cool)} .k-off{--k:var(--dim)} .k-act{--k:var(--dim)}
.pill{display:inline-block;border:1px solid var(--k);color:var(--k);border-radius:5px;padding:0 6px;font:600 11px/18px var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:8px 20px}
.card.cool{opacity:.6}
.who{min-width:0;display:flex;flex-direction:column;gap:3px}
.who h3{margin:0;font:600 16px/1.2 var(--display);overflow-wrap:anywhere}
.firm{color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.phone{font:600 17px var(--display);font-variant-numeric:tabular-nums;color:var(--fg);text-decoration:none;user-select:all}
.nophone{color:var(--dim);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-size:11.5px;border-radius:5px;padding:1px 6px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag.go{color:var(--accent)} .tag.hold{color:var(--hot)} .tag.closed{color:var(--dim)}
.props{min-width:0;display:flex;flex-direction:column;gap:6px}
.prop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.prop .ttl{min-width:0;overflow-wrap:anywhere} .prop .ttl a{color:var(--fg);text-decoration-color:var(--line)}
.prop .where{grid-column:2;color:var(--mute);font-size:12.5px}
.price{font:600 14px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{background:none;border:0;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-align:left}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 11.5px var(--display);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap;background:var(--panel2);position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{color:var(--mute);font-size:12.5px;max-width:75ch}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
@media (max-width:640px){ .card{grid-template-columns:minmax(0,1fr)} h1{font-size:21px} }
</style>
<div id="gate" hidden><form id="gate-form"><h1>Land Deal Radar</h1><label for="gate-pw">Password</label><input type="password" id="gate-pw" autocomplete="current-password"><button type="submit">Open</button><p id="gate-msg" class="note"></p></form></div>
<div class="wrap">
  <header class="top"><h1>Land Deal Radar</h1><span class="built" id="built"></span></header>
  <div class="tiles" id="tiles"></div>
  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="View"><button id="v-call" aria-pressed="true">Call list</button><button id="v-prop" aria-pressed="false">Properties</button></div>
      <select id="minp" aria-label="Smallest price"><option value="0">Any price</option><option value="2000000">$2M and up</option><option value="4000000" selected>$4M and up</option><option value="5000000">$5M and up</option><option value="10000000">$10M and up</option></select>
      <select id="state" aria-label="State"><option value="">Every state</option></select>
      <input type="search" id="q" placeholder="Search broker, firm, property, town">
    </div>
    <div class="row" id="chips"></div>
    <div class="row">
      <label class="ck"><input type="checkbox" id="fresh" checked> Hide brokers still resting after a call</label>
      <label class="ck"><input type="checkbox" id="hasph"> Only with a phone number</label>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div id="out"></div>
  <p class="note" id="foot"></p>
</div>

<script>
function boot(){
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
const KIND={uc:["Under contract",0],sp:["Sold or pending",1],gone:["Left the market",2],new:["Just listed",3],auc:["Auction",4],off:["Off market, unconfirmed",5],old:["Pending 90+ days",6],act:["For sale",7]};
const REGIONS=["All","Ranch country","Central Valley","Southern California","Rest of California"];
const S={view:"call",reg:"All",kinds:new Set(["uc","sp","gone","new"]),sort:"p",dir:-1,open:new Set()};
try{const v=JSON.parse(localStorage.getItem("radar1")||"{}");if(v.reg&&REGIONS.includes(v.reg))S.reg=v.reg;if(v.view)S.view=v.view;if(v.minp!=null)$("minp").value=v.minp;}catch(e){}
const save=()=>{try{localStorage.setItem("radar1",JSON.stringify({reg:S.reg,view:S.view,minp:$("minp").value}))}catch(e){}};
const money=p=>p>=1e6?"$"+(p/1e6).toFixed(p>=1e7?1:2).replace(/\.?0+$/,"")+"M":p?"$"+Math.round(p/1e3)+"K":"";
const regOf=r=>r.reg==="California, place unknown"?"Rest of California":r.reg;
const inReg=r=>S.reg==="All"||regOf(r)===S.reg;
const today=new Date();
function localTime(st){const tz=META.tz[st];if(!tz)return null;try{const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true,weekday:"short"}).formatToParts(today);
  const h24=+new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hour12:false}).format(today)%24;const wd=p.find(x=>x.type==="weekday").value;
  return {txt:p.filter(x=>["hour","literal","minute","dayPeriod"].includes(x.type)&&x.value!==", ").map(x=>x.value).join("").trim(),open:h24>=8&&h24<17&&wd!=="Sat"&&wd!=="Sun"}}catch(e){return null}}
const resting=c=>c&&c.next&&new Date(c.next+"T00:00:00")>today;
const md=d=>{if(!d)return"";const x=d.split("-");return (+x[1])+"/"+(+x[2])};
function crmTag(c,mail){
  if(!c) return mail?`<span class="tag">Emailed ${md(mail)}, never called</span>`:`<span class="tag go">Not in the CRM yet</span>`;
  const bits=[]; if(c.pin) bits.push(`<span class="tag go">US PIN</span>`);
  const o={talked:"Talked",lm:"Left message",pass:"Passed",skip:"Skipped"}[c.out];
  if(o&&c.out_at) bits.push(`<span class="tag">${o} ${md(c.out_at)}</span>`); else if(c.talked==="talked"||c.talked==="high") bits.push(`<span class="tag">Talked before</span>`); else bits.push(`<span class="tag go">In CRM, never talked</span>`);
  if(resting(c)) bits.push(`<span class="tag hold">Resting until ${md(c.next)}</span>`);
  if(mail) bits.push(`<span class="tag">Emailed ${md(mail)}</span>`);
  return bits.join("");
}
function pool(){
  const minp=+$("minp").value, st=$("state").value, q=$("q").value.trim().toLowerCase();
  return DATA.filter(r=>inReg(r)&&(!st||r.st===st)&&r.p>=minp&&(!q||(r.ag+" "+r.fm+" "+r.t+" "+r.ci+" "+r.co+" "+r.st).toLowerCase().includes(q)));
}
function where(r){return [r.ci,r.co&&r.co!==r.ci?r.co+(r.st==="CA"?" County":""):"",r.st].filter(Boolean).join(", ")}
function age(r){ if(r.k==="new") return r.dn===0?"listed today":`listed ${r.dn} day${r.dn===1?"":"s"} ago`;
  if(["uc","sp","gone","off","old"].includes(r.k)) return r.dm!=null?(r.dm===0?"changed today":`changed ${r.dm} day${r.dm===1?"":"s"} ago`):""; return r.dn!=null?`${r.dn} days on the radar`:""}
function propLine(r){return `<div class="prop k-${r.k}"><span class="pill">${KIND[r.k][0]}</span><span class="ttl"><a href="${esc(safeUrl(r.u))}" target="_blank" rel="noopener">${esc(r.t)||"Listing"}</a></span><span class="price">${money(r.p)}</span><span class="where">${esc(where(r))}${r.a?" · "+Number(r.a).toLocaleString()+" acres":""}${age(r)?" · "+age(r):""}</span></div>`}
function renderChips(base){
  const n={};base.forEach(r=>n[r.k]=(n[r.k]||0)+1);
  $("chips").innerHTML=Object.keys(KIND).filter(k=>n[k]).map(k=>`<button class="chip k-${k}" data-k="${k}" aria-pressed="${S.kinds.has(k)}"><i style="background:var(--k)"></i>${KIND[k][0]} ${n[k]}</button>`).join("");
}
function renderTiles(){
  const minp=+$("minp").value;
  $("tiles").innerHTML=REGIONS.map(g=>{const rs=DATA.filter(r=>(g==="All"||regOf(r)===g)&&r.p>=minp);
    const uc=rs.filter(r=>["uc","sp","gone"].includes(r.k)).length,nw=rs.filter(r=>r.k==="new").length;
    return `<button class="tile" data-reg="${g}" aria-pressed="${S.reg===g}"><b>${g==="All"?"Everything":g}</b><span>${uc} in motion · ${nw} just listed</span></button>`}).join("");
}
function render(){
  renderTiles(); const base=pool(); renderChips(base);
  const rows=base.filter(r=>S.kinds.has(r.k));
  $("v-call").setAttribute("aria-pressed",S.view==="call"); $("v-prop").setAttribute("aria-pressed",S.view==="prop");
  if(S.view==="prop") return renderTable(rows);
  const g=new Map();
  rows.forEach(r=>{ if(r.crm&&r.crm.dnc) return; const key=(r.ag||("firm:"+r.fm)||"").toLowerCase().trim(); if(!key||key==="firm:") return;
    if(!g.has(key)) g.set(key,{name:r.ag,firm:r.fm,ph:"",crm:null,mail:"",items:[],st:r.st});
    const x=g.get(key); x.items.push(r); if(!x.ph&&r.ph)x.ph=r.ph; if(!x.crm&&r.crm)x.crm=r.crm; if(!x.mail&&r.mail)x.mail=r.mail; if(!x.firm&&r.fm)x.firm=r.fm;});
  let list=[...g.values()]; const unnamed=rows.filter(r=>!r.ag&&!r.fm).length;
  list.forEach(x=>{x.items.sort((a,b)=>KIND[a.k][1]-KIND[b.k][1]||b.p-a.p); x.rank=KIND[x.items[0].k][1]; x.max=Math.max(...x.items.map(i=>i.p)); x.rest=resting(x.crm);});
  if($("fresh").checked) list=list.filter(x=>!x.rest); if($("hasph").checked) list=list.filter(x=>x.ph);
  list.sort((a,b)=>(!a.name)-(!b.name)||a.rank-b.rank||b.max-a.max);
  $("count").textContent=`${list.length} brokers · ${list.reduce((s,x)=>s+x.items.length,0)} properties`+(unnamed?` · ${unnamed} listings with no broker named`:"");
  if(!list.length){$("out").innerHTML=`<div class="empty">Nothing matches. Lower the price floor or turn on another status above.</div>`;return}
  $("out").innerHTML=`<div class="cards">`+list.slice(0,300).map((x,i)=>{
    const lt=localTime(x.items[0].st), key=(x.name||x.firm), open=S.open.has(key), show=open?x.items:x.items.slice(0,3);
    const d=x.ph.replace(/\D/g,"");
    return `<div class="card${x.rest?" cool":""}"><div class="who"><h3>${esc(x.name)||"Firm listing, no broker named"}</h3><div class="firm">${esc(x.firm)}</div>
      ${x.ph?`<a class="phone" href="tel:+1${d}">${esc(x.ph)}</a>`:`<span class="nophone">No phone on the listing</span>`}
      <div class="meta">${lt?`<span class="tag ${lt.open?"go":"closed"}">${esc(x.items[0].st)} ${lt.txt}${lt.open?"":" · closed"}</span>`:""}${crmTag(x.crm,x.mail)}</div></div>
      <div class="props">${show.map(propLine).join("")}${x.items.length>3?`<button class="more" data-open="${esc(key)}">${open?"Show fewer":"Show all "+x.items.length+" properties"}</button>`:""}</div></div>`}).join("")+`</div>`;
}
const COLS=[["k","Status"],["p","Price"],["t","Property"],["ci","Town"],["co","County"],["st","State"],["a","Acres"],["ag","Broker"],["fm","Firm"],["ph","Phone"],["dn","Days seen"]];
function renderTable(rows){
  const s=S.sort,d=S.dir; rows=[...rows].sort((a,b)=>{let x=a[s],y=b[s]; if(s==="k"){x=KIND[x][1];y=KIND[y][1]} return (x>y?1:x<y?-1:0)*d});
  $("count").textContent=`${rows.length} properties`;
  if(!rows.length){$("out").innerHTML=`<div class="empty">Nothing matches. Lower the price floor or turn on another status above.</div>`;return}
  $("out").innerHTML=`<div class="tablebox"><table><thead><tr>${COLS.map(c=>`<th data-s="${c[0]}">${c[1]}${S.sort===c[0]?(S.dir<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>`+
   rows.slice(0,600).map(r=>`<tr class="k-${r.k}"><td><span class="pill">${KIND[r.k][0]}</span></td><td class="n">${money(r.p)}</td><td><a href="${esc(safeUrl(r.u))}" target="_blank" rel="noopener">${esc(r.t)}</a></td><td>${esc(r.ci)}</td><td>${esc(r.co)}</td><td>${esc(r.st)}</td><td class="n">${r.a?Number(r.a).toLocaleString():""}</td><td>${esc(r.ag)}</td><td>${esc(r.fm)}</td><td class="n">${r.ph?`<a href="tel:+1${r.ph.replace(/\D/g,"")}">${esc(r.ph)}</a>`:""}</td><td class="n">${r.dn??""}</td></tr>`).join("")+`</tbody></table></div>`;
}
$("built").textContent="Updated "+META.built;
[...new Set(DATA.map(r=>r.st))].sort().forEach(s=>$("state").add(new Option(s,s)));
$("foot").textContent="Under contract means the listing site says so. Sold or pending is a site that uses one label for both. Past 90 days either one has almost surely closed, so those are off unless you turn them on. Left the market means a California listing that was for sale and is gone from the live site as of today: in escrow, sold or pulled. Off market, unconfirmed is the old radar guess for other states and is wrong often, so it is off unless you turn it on. Just listed means first seen in the last "+META.new_days+" days.";

  else if(t.id==="v-call")S.view="call"; else if(t.id==="v-prop")S.view="prop";
  else if(t.dataset.open){S.open.has(t.dataset.open)?S.open.delete(t.dataset.open):S.open.add(t.dataset.open)}

(async function(){
  const wrap=document.querySelector(".wrap"), gate=document.getElementById("gate");
  if(!ENC){boot();return}
  const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  async function open(pw){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(ENC.iv)},key,b(ENC.ct));
    DATA=JSON.parse(new TextDecoder().decode(pt));
  }
  async function attempt(pw,quiet){
    try{await open(pw);try{localStorage.setItem("radar1pw",pw)}catch(e){} gate.hidden=true;wrap.hidden=false;boot();return true}
    catch(e){if(!quiet)document.getElementById("gate-msg").textContent="That password did not open it. Try again.";return false}
  }
  wrap.hidden=true;gate.hidden=false;
  let saved="";try{saved=localStorage.getItem("radar1pw")||""}catch(e){}
  if(saved&&await attempt(saved,true))return;
  document.getElementById("gate-form").addEventListener("submit",e=>{e.preventDefault();attempt(document.getElementById("gate-pw").value)});
  document.getElementById("gate-pw").focus();
})();
</script>
